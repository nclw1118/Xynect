services:
  postgres:
    image: postgres:16
    container_name: xynect-postgres
    environment:
      POSTGRES_USER: xynect
      POSTGRES_PASSWORD: xynect_password
      POSTGRES_DB: xynect_mvp
    ports:
      - "5432:5432"
    volumes:
      - xynect_pg_data:/var/lib/postgresql/data

volumes:
  xynect_pg_data: